name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            tmux: system
          - os: ubuntu-24.04
            tmux: 3.3a
          - os: macos-latest
            tmux: system
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4
      - name: Install tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux shellcheck build-essential libevent-dev libncurses-dev bison pkg-config
      - name: Install tools on macOS
        if: runner.os == 'macOS'
        run: brew install tmux shellcheck
      - name: Build minimum supported tmux
        if: matrix.tmux == '3.3a'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 https://github.com/tmux/tmux/releases/download/3.3a/tmux-3.3a.tar.gz -o tmux.tar.gz
          echo 'e4fd347843bd0772c4f48d6dde625b0b109b7a380ff15db21e97c11a4dcdf93f  tmux.tar.gz' | sha256sum -c -
          tar -xzf tmux.tar.gz
          cd tmux-3.3a
          ./configure
          make -j2
          mkdir -p "$RUNNER_TEMP/tmux-bin"
          cp tmux "$RUNNER_TEMP/tmux-bin/tmux"
          echo "$RUNNER_TEMP/tmux-bin" >> "$GITHUB_PATH"
      - name: Verify
        run: |
          tmux -V
          make check
