name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            tmux: '3.8'
            sha256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
            utempter: enable
          - os: ubuntu-24.04
            tmux: '3.3a'
            sha256: e4fd347843bd0772c4f48d6dde625b0b109b7a380ff15db21e97c11a4dcdf93f
            utempter: disable
          - os: macos-latest
            tmux: system
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4
      - name: Install tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck build-essential libevent-dev libncurses-dev libutempter-dev bison pkg-config
      - name: Install tools on macOS
        if: runner.os == 'macOS'
        run: brew install tmux shellcheck
      # Pre-3.6 libutempter builds can lose SIGCHLD (tmux/tmux#4559).
      # Keep the minimum without it and exercise it on the fixed release.
      - name: Build Linux tmux
        if: runner.os == 'Linux'
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
          TMUX_SHA256: ${{ matrix.sha256 }}
          TMUX_UTEMPTER: ${{ matrix.utempter }}
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz" -o tmux.tar.gz
          printf '%s  tmux.tar.gz\n' "$TMUX_SHA256" | sha256sum -c -
          tar -xzf tmux.tar.gz
          cd "tmux-$TMUX_VERSION"
          ./configure "--$TMUX_UTEMPTER-utempter"
          make -j2
          mkdir -p "$RUNNER_TEMP/tmux-bin"
          cp tmux "$RUNNER_TEMP/tmux-bin/tmux"
          echo "$RUNNER_TEMP/tmux-bin" >> "$GITHUB_PATH"
      - name: Verify
        run: |
          tmux -V
          make check
